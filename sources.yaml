# Free, credible sources for every section in sections.yaml.
# Built from the research in reports/ (Nov 2026). Every outlet is free to read.
#
# Feed URLs were last checked on 2026-11-01. Re-check with
#   python -m worldbrief validate
# and fix or disable (enabled: false) any that fail before shipping.
#
# Fields
#   type        plugin: rss | arxiv | gdelt | hackernews | substack | hf_papers
#   category    section id;  topic: subtopic id (sections that have them)
#   region      global (default) | africa | asia | middle_east | europe | americas | oceania
#   ownership   independent (default) | public | state_linked | aggregator
#   note        shown on the app's "Our sources" page
#   limited_in  countries where free reading is limited (e.g. bbc.com in the US)
#
# Not included on purpose: state propaganda outlets (RT, Sputnik, TASS, Xinhua,
# CGTN, Global Times, Press TV, TeleSUR, KCNA ...) and paywalled outlets.

