# The menu of sections the app shows in its picker. The app reads this
# (it's embedded in index.json), so adding a section here + sources for it in
# sources.yaml makes it appear in the app with no app update.
#
# symbol: an SF Symbols name for the iOS icon
# default: whether the section is on for a new user
# by_region: show a region filter (Africa, Asia, ...) inside the section
# max_age_hours: how long items stay (default 36). News is kept short so the
#   feed stays live; opinion and papers are read at leisure, so they stay longer.
#   A subtopic can set its own max_age_hours to override the section's.

sections:
  - id: world
    title: World & Politics
    symbol: globe.americas
    description: Governments, elections, conflicts and diplomacy in every region
    default: true
    by_region: true
    max_age_hours: 30

  - id: opinion
    title: Opinion & Analysis
    symbol: text.quote
    description: Editorials, columns, think-tank analysis and long reads to read at your own pace
    default: true
    by_region: true
    max_age_hours: 168
    subtopics:
      - {id: editorials, title: Editorials}
      - {id: columns,    title: Columns & Op-eds}
      - {id: analysis,   title: Policy & Think Tanks}
      - {id: experts,    title: Expert Commentary}
      - {id: essays,     title: Long Reads & Essays}
      - {id: newsletters, title: Independent Newsletters}

  - id: business
    title: Business & Economy
    symbol: chart.line.uptrend.xyaxis
    description: Markets, companies, trade and economic policy, with market commentary
    default: true
    by_region: true
    max_age_hours: 48
    # Commentary and investing blogs post every few days and stay worth
    # reading for a week, so that subtopic keeps items longer.
    subtopics:
      - {id: news,        title: Business News}
      - {id: markets,     title: Markets & Stocks}
      - {id: economy,     title: Economy & Central Banks}
      - {id: commodities, title: Commodities & Currencies}
      - {id: crypto,      title: Crypto}
      - {id: commentary,  title: Market Commentary, max_age_hours: 168}

  - id: technology
    title: Technology
    symbol: cpu
    description: Tech industry, products, startups and the internet
    default: true
    max_age_hours: 48

  - id: science
    title: Science & Research
    symbol: atom
    description: New papers and discoveries across the sciences
    default: true
    max_age_hours: 168
    subtopics:
      - {id: physics,   title: Physics}
      - {id: particle,  title: Particle & Nuclear Physics}
      - {id: space,     title: Space & Astronomy}
      - {id: ai,        title: AI & Machine Learning}
      - {id: computing, title: Computer Science}
      - {id: biology,   title: Biology}
      - {id: chemistry, title: Chemistry & Materials}
      - {id: earth,     title: Earth Science}
      - {id: general,   title: Science News}

  - id: health
    title: Health & Medicine
    symbol: cross.case
    description: Public health, medical research, fitness, nutrition and mental health
    default: false
    # Fitness and nutrition pieces stay useful for days, and those feeds post less often.
    max_age_hours: 168
    subtopics:
      - {id: news,      title: Health News}
      - {id: research,  title: Medical Research}
      - {id: fitness,   title: Fitness & Wellbeing}
      - {id: nutrition, title: Nutrition}
      - {id: mental,    title: Mental Health}

  - id: climate
    title: Climate & Environment
    symbol: leaf
    description: Climate science, energy, nature and environmental policy
    default: false
    max_age_hours: 120

  - id: sports
    title: Sports
    symbol: sportscourt
    description: Cricket, kabaddi, football, tennis, F1, US sports and more
    default: false
    # Smaller sports post every day or two, so a short window would empty them.
    max_age_hours: 72
    subtopics:
      - {id: general,   title: Top Sports}
      - {id: cricket,   title: Cricket}
      - {id: kabaddi,   title: Kabaddi}
      - {id: football,  title: Football}
      - {id: tennis,    title: Tennis}
      - {id: motorsport, title: F1 & Motorsport}
      - {id: us,        title: Basketball & US Sports}
      - {id: olympic,   title: Olympics & Athletics}
      - {id: rugby_golf, title: Rugby & Golf}

  - id: culture
    title: Culture & Arts
    symbol: theatermasks
    description: Film, music, books, art and entertainment
    default: false
    max_age_hours: 96
