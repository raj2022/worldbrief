name: Refresh news

on:
  schedule:
    - cron: "3,18,33,48 * * * *"   # off the busy :00 mark; ticker.yml adds runs every 5 min
  workflow_dispatch:

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # A failure here stops the run, so a bad push never replaces the published
      # news. The last good digest stays up and the app says it's out of date.
      - run: python -m pytest -q

      # Each run saves a new cache and restores the newest one, so stories
      # persist between runs.
      - uses: actions/cache@v6
        with:
          path: .cache
          key: store-${{ github.run_id }}
          restore-keys: store-

      # Runs come every 5 minutes so market prices stay current, but each feed
      # is fetched at most every 14, to stay polite to publishers.
      - run: python -m worldbrief run --out-dir dist --store .cache/store.json --min-source-minutes 14
        env:
          WORLDBRIEF_CONTACT: ${{ vars.WORLDBRIEF_CONTACT || format('https://github.com/{0}', github.repository) }}

      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages uses GITHUB_SHA as the Pages build version. Refreshes don't
      # make commits, so every deploy reused one version and Pages eventually
      # kept serving an old build while runs reported success (Nov 13, Nov 17).
      # A per-run version makes each deploy distinct.
      - id: deployment
        uses: actions/deploy-pages@v5
        env:
          GITHUB_SHA: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
