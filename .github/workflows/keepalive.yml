name: Keep schedules alive

# GitHub disables scheduled workflows after 60 days without repo activity.
# Re-enabling them resets that clock.
on:
  schedule:
    - cron: "43 4 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - run: |
          gh workflow enable refresh.yml --repo "$GITHUB_REPOSITORY"
          gh workflow enable keepalive.yml --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
