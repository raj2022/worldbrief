name: Refresh ticker

# GitHub's cron barely fires for this repo (once in ~14 hours when tested), so
# this job starts refresh.yml every 5 minutes itself. A job can run at most
# 6 hours, so before then it starts its own replacement. Dispatches made with
# GITHUB_TOKEN do start new runs (workflow_dispatch is the exception to the
# "no recursive runs" rule). The cron below restarts the chain if it ever breaks.
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */2 * * *"

# One ticker at a time. A newer run waits for the current one to finish.
concurrency:
  group: ticker
  cancel-in-progress: false

permissions:
  actions: write
  contents: write   # for the empty "new build version" commit below

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      # deploy-pages uses the commit SHA as the Pages build version and it can't
      # be overridden. With no new commits, every deploy reused one version and
      # Pages got stuck serving an old build while runs stayed green (Nov 13,
      # Nov 17). An empty commit per ticker cycle (~every 5.5h) keeps it moving.
      - name: Make a new commit so Pages gets a new build version
        continue-on-error: true   # never let this stop the refresh loop
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          head=$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)
          tree=$(gh api "repos/$REPO/git/commits/$head" --jq .tree.sha)
          new=$(gh api "repos/$REPO/git/commits" -f message="Refresh Pages build version [skip ci]" \
                -f tree="$tree" -f "parents[]=$head" --jq .sha)
          gh api -X PATCH "repos/$REPO/git/refs/heads/main" -f sha="$new" >/dev/null \
            || echo "::warning::could not advance main (someone pushed?); next cycle will retry"

      - name: Start a refresh every 5 minutes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          stop=$((SECONDS + 5*3600 + 30*60))   # 5h30m, then hand over
          while [ "$SECONDS" -lt "$stop" ]; do
            gh workflow run refresh.yml --repo "$REPO" || echo "::warning::refresh dispatch failed"
            sleep 300
          done

      - name: Start the next ticker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ticker.yml --repo "${{ github.repository }}"
