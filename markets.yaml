# The app's market dashboard: what it tracks and what each row is called.
#
# Prices come from Yahoo Finance's public chart data (no key, about 15 minutes
# delayed for most exchanges) and are fetched on every refresh. If a symbol or
# the whole request fails, the last good price stays, with its own timestamp,
# so the app can say how old it is. Check symbols with
#   python -m worldbrief markets
#
# groups: rows shown together in the app, in this order
#   symbol    Yahoo Finance symbol
#   name      what the app calls it
#   unit      shown after the price ("%" for yields, "$/oz" for gold ...)
#   decimals  digits after the point (default: Yahoo's own hint, else 2)
#   keywords  extra words that find the instrument in headlines (lower case);
#             its name, without the bracketed note, is always one
# movers: lists of stocks; the app shows the biggest risers and fallers of each.
#   The lists are fixed here, so review them when the indices rebalance.

